<details class="quick-reply" hx-get="/ai/people/{{ person.id }}/quick-replies"
         hx-trigger="toggle" hx-swap="innerHTML"
         hx-on:toggle="if(!this.open) this.removeAttribute('hx-get')">
  <summary class="text-sm" style="cursor:pointer; font-weight:600; color:var(--accent);">💬 Not sure what to say? Quick reply ideas</summary>
  <div style="padding:.3rem;">
    <p class="text-muted text-sm">Loading…</p>
  </div>
</details>
