{% extends "base.html" %}
{% block title %}Welcome — {{ app_name }}{% endblock %}
{% block auth_content %}
<div class="auth-wrap">
  <div class="card auth-card">
    <h1>Welcome 👋</h1>
    <p class="text-muted">Let's create your admin account to get started with {{ app_name }}.</p>
    {% if error %}<div class="notice notice-danger">{{ error }}</div>{% endif %}
    <form method="post" action="/setup">
      <div class="field">
        <label for="name">Your name</label>
        <input type="text" id="name" name="name" value="{{ name or '' }}" required autofocus>
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" value="{{ email or '' }}" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required minlength="8">
      </div>
      <div class="field">
        <label for="password_confirm">Confirm password</label>
        <input type="password" id="password_confirm" name="password_confirm" required minlength="8">
      </div>
      <button class="btn btn-primary btn-block" type="submit">Create account</button>
    </form>
  </div>
</div>
{% endblock %}
