{% if error %}
  <p class="text-muted text-sm">{{ error }}</p>
{% elif not assets %}
  <p class="text-muted text-sm">🌿 No photos found for this person in Immich yet.</p>
{% else %}
<div class="carousel-wrap" x-data>
  <button class="carousel-btn" type="button" aria-label="Scroll left"
    @click="$refs.track.scrollBy({left: -320, behavior: 'smooth'})">‹</button>
  <div class="photo-carousel" x-ref="track">
    {% for a in assets %}
      <a class="photo-carousel-item" href="/immich/asset/{{ a.id }}/original">
        <img src="/immich/asset/{{ a.id }}/thumbnail" loading="lazy" class="lightbox-target" alt="">
      </a>
    {% endfor %}
  </div>
  <button class="carousel-btn" type="button" aria-label="Scroll right"
    @click="$refs.track.scrollBy({left: 320, behavior: 'smooth'})">›</button>
</div>
<p class="text-muted text-sm mt-1">
  {{ assets|length }} photo{{ "s" if assets|length != 1 else "" }}{{ " (most recent shown)" if assets|length >= 60 else "" }}
</p>
{% endif %}
