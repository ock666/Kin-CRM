{% if error %}
  <p class="text-muted text-sm">{{ error }}</p>
{% elif not assets %}
  <p class="text-muted text-sm">No photos found for this person in Immich yet.</p>
{% else %}
  {% for a in assets %}
    <a href="/immich/asset/{{ a.id }}/original" target="_blank"><img src="/immich/asset/{{ a.id }}/thumbnail" loading="lazy" alt=""></a>
  {% endfor %}
{% endif %}
